stages:
  - test
  - build

migration-postgres:
  stage: test
  image: python:3.13
  services:
    - name: postgres:17-bookworm
      alias: postgres
  variables:
    POSTGRES_DB: libris_test
    POSTGRES_USER: libris
    POSTGRES_PASSWORD: libris_test_password
    DATABASE_URL: postgresql+psycopg://libris:libris_test_password@postgres:5432/libris_test
    SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
    BOOTSTRAP_PASSWORD: ci-only-password-with-more-than-16-characters
  before_script:
    - pip install -r backend/requirements.lock
  script:
    - cd backend
    - alembic upgrade head
    - alembic downgrade c93b8c242df1
    - alembic upgrade head

backend:
  stage: test
  image: python:3.13
  before_script:
    - pip install -r backend/requirements.lock
    - pip install -e './backend[test]'
  script:
    - python3 scripts/check_version.py
    - cd backend
    - pytest -q
    - ruff check app tests

frontend:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
    - npm audit --omit=dev --audit-level=high

security:
  stage: test
  image: python:3.13
  before_script:
    - pip install pip-audit==2.9.0
  script:
    - pip-audit -r backend/requirements.lock

container-build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --tag libris:ci .
    - docker build --file codex_bridge/Dockerfile --tag libris-codex:ci .
