stages: [test, build, verify, publish, release, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  timeout: 30 minutes

variables:
  DOCKER_BUILDKIT: "1"
  DOCKERHUB_IMAGE: heartbtz/libris
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

migration-postgres:
  stage: test
  script:
    - DB_CONTAINER="libris-ci-postgres-$CI_JOB_ID"
    # Throwaway database: keep its data in memory so that nothing can be left on the runner's disk.
    - docker run --detach --name "$DB_CONTAINER" --tmpfs /var/lib/postgresql/data --env POSTGRES_DB=libris_test --env POSTGRES_USER=libris --env POSTGRES_PASSWORD=libris_test_password postgres:17-bookworm
    - for attempt in $(seq 1 30); do docker exec "$DB_CONTAINER" pg_isready -U libris -d libris_test && break; test "$attempt" -lt 30; sleep 1; done
    - >-
      docker run --rm --network "container:$DB_CONTAINER"
      --volume "$CI_PROJECT_DIR:/work" --workdir /work
      --env DATABASE_URL=postgresql+psycopg://libris:libris_test_password@127.0.0.1:5432/libris_test
      --env LIBRIS_TEST_DATABASE_URL=postgresql+psycopg://libris:libris_test_password@127.0.0.1:5432/libris_test
      --env SECRET_KEY=ci-only-secret-key-with-more-than-32-characters
      --env BOOTSTRAP_PASSWORD=ci-only-password-with-more-than-16-characters
      python:3.13-bookworm sh -lc
      "pip install -q -r backend/requirements.lock && pip install -q -e './backend[test]' && cd backend && alembic upgrade head && alembic downgrade c93b8c242df1 && alembic upgrade head && pytest -q"
  after_script:
    - docker rm --force --volumes "libris-ci-postgres-$CI_JOB_ID" >/dev/null 2>&1 || true

backend:
  stage: test
  script:
    - >-
      docker run --rm --volume "$CI_PROJECT_DIR:/work" --workdir /work
      --env CI_COMMIT_TAG="${CI_COMMIT_TAG:-}"
      python:3.13-bookworm sh -lc
      "pip install -q -r backend/requirements.lock && pip install -q -e './backend[test]' && if [ -n \"\$CI_COMMIT_TAG\" ]; then python3 scripts/check_version.py \"\$CI_COMMIT_TAG\"; else python3 scripts/check_version.py; fi && cd backend && pytest -q && ruff check app tests"

frontend:
  stage: test
  script:
    - docker run --rm --volume "$CI_PROJECT_DIR:/work" --workdir /work/frontend node:22-bookworm sh -lc "npm ci --cache .npm --prefer-offline && npm run build && npm audit --omit=dev --audit-level=high"
    - docker run --rm --ipc=host --volume "$CI_PROJECT_DIR:/work" --workdir /work/frontend --env CI=true "$PLAYWRIGHT_IMAGE" sh -lc "npm ci --cache .npm --prefer-offline && npx playwright test e2e/accounts.spec.ts e2e/batch-configure.spec.ts e2e/editor-conflict.spec.ts e2e/editor-guards.spec.ts e2e/errors.spec.ts e2e/library-import.spec.ts e2e/providers.spec.ts e2e/showcase.spec.ts e2e/stale-responses.spec.ts"

security:
  stage: test
  script:
    - docker run --rm --volume "$CI_PROJECT_DIR:/work" --workdir /work python:3.13-bookworm sh -lc "pip install -q pip-audit==2.9.0 && pip-audit -r backend/requirements.lock"

secret-scan:
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm --volume "$CI_PROJECT_DIR:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner

release-policy:
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch --no-tags origin "$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"
    - docker run --rm --volume "$CI_PROJECT_DIR:/work" --workdir /work python:3.13-bookworm python3 scripts/check_version.py "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

container-build:
  stage: build
  interruptible: false
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    # Every default-branch commit leaves two ~500 MB images on the shared runner. Drop this project's own
    # unused images after three days: they all remain in the registry, and nothing else on the runner is touched.
    - docker image prune --all --force --filter "label=org.opencontainers.image.source=https://github.com/HeartBtz/Libris" --filter "until=72h" >/dev/null || true
    - if ! docker pull "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA"; then docker build --pull --build-arg VCS_REF="$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA" . && docker push "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA"; fi
    - if ! docker pull "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA"; then docker build --pull --file codex_bridge/Dockerfile --build-arg VCS_REF="$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA" . && docker push "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA"; fi
    - APP_IMAGE_REFERENCE="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA")"
    - CODEX_IMAGE_REFERENCE="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA")"
    - test -n "$APP_IMAGE_REFERENCE" && test -n "$CODEX_IMAGE_REFERENCE"
    - printf 'APP_IMAGE_REFERENCE=%s\nCODEX_IMAGE_REFERENCE=%s\n' "$APP_IMAGE_REFERENCE" "$CODEX_IMAGE_REFERENCE" > image.env
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release-images:
  stage: build
  interruptible: false
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA"
    - docker pull "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA"
    - APP_IMAGE_REFERENCE="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA")"
    - CODEX_IMAGE_REFERENCE="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$CI_REGISTRY_IMAGE:codex-sha-$CI_COMMIT_SHA")"
    - test -n "$APP_IMAGE_REFERENCE" && test -n "$CODEX_IMAGE_REFERENCE"
    - printf 'APP_IMAGE_REFERENCE=%s\nCODEX_IMAGE_REFERENCE=%s\n' "$APP_IMAGE_REFERENCE" "$CODEX_IMAGE_REFERENCE" > image.env
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

container-runtime:
  stage: verify
  needs:
    - job: container-build
      optional: true
    - job: release-images
      optional: true
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$APP_IMAGE_REFERENCE"
    - docker pull "$CODEX_IMAGE_REFERENCE"
  script:
    - APP_VERSION="$(docker run --rm --entrypoint python "$APP_IMAGE_REFERENCE" -c 'import app; print(app.__version__)')"
    - LABEL_VERSION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$APP_IMAGE_REFERENCE")"
    - LABEL_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$APP_IMAGE_REFERENCE")"
    - test "$APP_VERSION" = "$LABEL_VERSION"
    - test "$LABEL_REVISION" = "$CI_COMMIT_SHA"
    - test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CODEX_IMAGE_REFERENCE")" = "$CI_COMMIT_SHA"
    - test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$CODEX_IMAGE_REFERENCE")" = "$APP_VERSION"
    - docker run --rm --entrypoint codex "$CODEX_IMAGE_REFERENCE" --version
    - docker run --rm --interactive --entrypoint python "$APP_IMAGE_REFERENCE" - < scripts/check_epubcheck.py
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container-scan:
  stage: verify
  resource_group: libris-trivy-cache
  needs:
    - job: container-build
      optional: true
    - job: release-images
      optional: true
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - export TRIVY_CACHE_VOLUME=libris-trivy-cache
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$APP_IMAGE_REFERENCE"
    - docker volume create "$TRIVY_CACHE_VOLUME" >/dev/null
  script:
    - docker run --rm --env TMPDIR=/root/.cache/trivy --volume "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx "$APP_IMAGE_REFERENCE" > libris.cdx.json
    - docker run --rm --env TMPDIR=/root/.cache/trivy --volume "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$APP_IMAGE_REFERENCE"
    - docker run --rm --env TMPDIR=/root/.cache/trivy --volume "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CODEX_IMAGE_REFERENCE"
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
  artifacts:
    when: always
    paths: [libris.cdx.json]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.publish-image:
  stage: publish
  interruptible: false
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$APP_IMAGE_REFERENCE"
    - docker pull "$CODEX_IMAGE_REFERENCE"
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish-gitlab:
  extends: .publish-image
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - MINOR="${VERSION%.*}"
    - for tag in "$VERSION" "$MINOR" latest; do docker tag "$APP_IMAGE_REFERENCE" "$CI_REGISTRY_IMAGE:$tag"; docker push "$CI_REGISTRY_IMAGE:$tag"; docker tag "$CODEX_IMAGE_REFERENCE" "$CI_REGISTRY_IMAGE:codex-$tag"; docker push "$CI_REGISTRY_IMAGE:codex-$tag"; done

publish-dockerhub:
  extends: .publish-image
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-$CI_JOB_ID"
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$APP_IMAGE_REFERENCE"
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - MINOR="${VERSION%.*}"
    - for tag in "$VERSION" "$MINOR" latest; do docker tag "$APP_IMAGE_REFERENCE" "$DOCKERHUB_IMAGE:$tag"; docker push "$DOCKERHUB_IMAGE:$tag"; done
    - python3 scripts/publish_dockerhub_overview.py
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN

release-gitlab:
  stage: release
  interruptible: false
  script:
    - >-
      curl --fail --silent --show-error --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --data-urlencode "name=Libris $CI_COMMIT_TAG"
      --data-urlencode "tag_name=$CI_COMMIT_TAG"
      --data-urlencode description@CHANGELOG.md
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

deploy-production:
  stage: deploy
  interruptible: false
  timeout: 25 minutes
  resource_group: libris-production-ct116
  # `needs` bypasses stage ordering: every gate the deployment must wait for is listed explicitly.
  needs:
    - job: release-images
      artifacts: true
    - job: container-runtime
      artifacts: false
    - job: container-scan
      artifacts: false
    - job: publish-gitlab
      artifacts: false
  script:
    - |
      timeout --signal=TERM --kill-after=5m 20m \
        ssh -o BatchMode=yes root@ct116-opencode.homelab.hbtz.lan \
        bash -s -- "$CI_COMMIT_SHA" "${CI_COMMIT_TAG#v}" \
        "$APP_IMAGE_REFERENCE" "$CODEX_IMAGE_REFERENCE" <<'REMOTE'
      set -euo pipefail
      commit="$1"
      version="$2"
      app_reference="$3"
      codex_reference="$4"
      [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
      [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      [[ "$app_reference" == 192.168.1.126:5050/dev/libris@sha256:* ]]
      [[ "$codex_reference" == 192.168.1.126:5050/dev/libris@sha256:* ]]
      export DOCKER_CONFIG=/etc/libris-registry
      docker pull "$app_reference"
      docker pull "$codex_reference"
      docker tag "$app_reference" "libris-production:$commit"
      docker tag "$codex_reference" "libris-codex-production:$commit"
      app_image_id="$(docker image inspect --format '{{.Id}}' "libris-production:$commit")"
      codex_image_id="$(docker image inspect --format '{{.Id}}' "libris-codex-production:$commit")"
      timeout --signal=TERM --kill-after=5m 15m /usr/local/sbin/libris-production-deploy \
        "$commit" "$version" "$app_image_id" "$codex_image_id"
      REMOTE
  environment:
    name: production
    url: http://192.168.1.116:8088
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"
