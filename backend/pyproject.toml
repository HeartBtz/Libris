[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-translator"
version = "0.3.1"
description = "Context-aware literary EPUB translation workbench"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "python-multipart>=0.0.20", "cryptography>=44",
  "ebooklib>=0.19,<1", "lxml>=5.3,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "respx>=0.22"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
