name: epub-translator
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-app: &app
  build: .
  image: ${LIBRIS_IMAGE:-epub-translator:local}
  env_file: ${LIBRIS_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql+psycopg://translator:${POSTGRES_PASSWORD:?Run scripts/setup.py}@database:5432/translator
    DATA_DIR: /data
  volumes:
    - books:/data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 512
  logging: *logging
services:
  codex:
    profiles: [codex]
    build:
      context: .
      dockerfile: codex_bridge/Dockerfile
    image: ${LIBRIS_CODEX_IMAGE:-epub-translator-codex:local}
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8092/health',headers={'Authorization':'Bearer '+os.environ['CODEX_BRIDGE_TOKEN']}); urllib.request.urlopen(r)"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:-}
    volumes:
      - codex-state:/state
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    logging: *logging
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: translator
      POSTGRES_DB: translator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U translator -d translator"]
      interval: 5s
      timeout: 5s
      retries: 20
    pids_limit: 256
    logging: *logging
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: [python, -m, app.jobs.worker]
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
volumes:
  codex-state:
  books:
  database:
